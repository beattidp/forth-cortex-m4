[platformio]
default_envs = nucleo_g474re
src_dir = src
include_dir = include

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube

build_flags = 
    -I include
    -I ../../kernel/include
    -I ../../kernel/src
    -D STM32G474xx
    -g3
    -O2

build_src_filter = 
    -<*>
    +<boot_nucleo_g474re.S>
    +<forth_kernel.S>

board_build.stm32cube.custom_config_header = yes

upload_protocol = stlink
upload_flags =
    -c
    reset_config none
debug_tool = stlink
debug_server =
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/bin/openocd
    -s
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/openocd/scripts
    -f
    board/st_nucleo_g4.cfg
    -c
    reset_config none

monitor_speed = 115200
