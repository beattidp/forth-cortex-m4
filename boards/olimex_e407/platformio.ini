[platformio]
default_envs = olimex_e407
src_dir = src
include_dir = include

[env:olimex_e407]
platform = ststm32
board = olimex_e407
framework = stm32cube

; change microcontroller
board_build.mcu = stm32f407zgt6

; change MCU frequency
board_build.f_cpu = 168000000L

; Build settings
build_flags = 
    -I include
    -I ../../kernel/include
    -I ../../kernel/src
    -D STM32F407xx
    -g3
    -O2

board_build.stm32cube.custom_config_header = yes

; JTAG interface
upload_protocol = jlink-jtag
extra_scripts = extra_upload.py

debug_tool = jlink
debug_port = :2331

debug_server =
  /usr/bin/JLinkGDBServerCLExe
  -singlerun
  -if 
  JTAG
  -select
  USB
  -port
  2331
  -device
  STM32F407ZGT6

; Serial monitor configuration for TTL-232R_RPi
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
