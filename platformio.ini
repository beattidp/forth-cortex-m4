; PlatformIO Multi-Board Configuration
; Supports ST Nucleo-G474RE and Olimex STM32-E407

[platformio]
default_envs = nucleo_g474re, olimex_e407
src_dir = kernel/src
include_dir = kernel/include

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
build_flags = 
    -I boards/nucleo_g474re/include
    -I kernel/include
    -I kernel/src
    -D STM32G474xx
    -g3
    -O2
build_src_filter = 
    +<forth_kernel.S>
    +<../../boards/nucleo_g474re/src/boot_nucleo_g474re.S>
upload_protocol = stlink
upload_flags =
    -c
    reset_config srst_only connect_assert_srst
debug_tool = stlink
debug_server =
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/bin/openocd
    -s
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/openocd/scripts
    -f
    board/st_nucleo_g4.cfg
    -c
    reset_config none
monitor_speed = 115200

[env:olimex_e407]
platform = ststm32
board = olimex_e407
framework = stm32cube
board_build.mcu = stm32f407zgt6
board_build.f_cpu = 168000000L
board_build.stm32cube.custom_config_header = yes
build_flags = 
    -I boards/olimex_e407/include
    -I kernel/include
    -I kernel/src
    -D STM32F407xx
    -g3
    -O2
build_src_filter = 
    +<forth_kernel.S>
    +<../../boards/olimex_e407/src/boot_olimex_e407.S>
upload_protocol = jlink-jtag
extra_scripts = boards/olimex_e407/extra_upload.py
debug_tool = jlink
debug_port = :2331
debug_server =
  /usr/bin/JLinkGDBServerCLExe
  -singlerun
  -if 
  JTAG
  -select
  USB
  -port
  2331
  -device
  STM32F407ZGT6
monitor_port = /dev/ttyUSB1
monitor_speed = 115200
